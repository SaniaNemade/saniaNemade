<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" fill="none"><style>
  .serif { font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'DejaVu Serif', serif; } .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
  @keyframes up { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
  @keyframes twinkle { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
  @keyframes pulse { 0% { opacity: .9; r: 3.5 } 80%,100% { opacity: 0; r: 10 } }
  @keyframes travel { from { offset-distance: 0% } to { offset-distance: 100% } }
  @keyframes draw { to { stroke-dashoffset: 0 } }
  .up { opacity: 0; animation: up .7s cubic-bezier(.2,.7,.2,1) forwards; }
  .tw { animation: twinkle 3.2s ease-in-out infinite; }
  .pulse { animation: pulse 2.2s ease-out infinite; }
</style>
