<svg xmlns="http://www.w3.org/2000/svg" width="900" height="90" viewBox="0 0 900 90" fill="none"><style>
  .serif { font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, 'DejaVu Serif', serif; } .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, 'DejaVu Sans', sans-serif; } .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
  @keyframes up { from { opacity: 0; transform: translateY(6px) } to { opacity: 1; transform: none } }
  @keyframes twinkle { 0%,100% { opacity: .25 } 50% { opacity: 1 } }
  @keyframes pulse { 0% { opacity: .9; r: 3.5 } 80%,100% { opacity: 0; r: 10 } }
  @keyframes travel { from { offset-distance: 0% } to { offset-distance: 100% } }
  @keyframes draw { to { stroke-dashoffset: 0 } }
  .up { opacity: 0; animation: up .7s cubic-bezier(.2,.7,.2,1) forwards; }
  .tw { animation: twinkle 3.2s ease-in-out infinite; }
  .pulse { animation: pulse 2.2s ease-out infinite; }
</style>
<defs>
  <linearGradient id="acc" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#6d4aff"/><stop offset="1" stop-color="#0284c7"/>
  </linearGradient>
  <radialGradient id="glow" cx=".5" cy=".5" r=".5">
    <stop offset="0" stop-color="#6d4aff" stop-opacity=".22"/>
    <stop offset="1" stop-color="#6d4aff" stop-opacity="0"/>
  </radialGradient>
</defs><line x1="2" y1="20" x2="898" y2="20" stroke="#000000" stroke-opacity="0.09"/><text x="450.0" y="58" class="serif" font-size="15" fill="#59636e" font-weight="400" text-anchor="middle" font-style="italic" letter-spacing=".5">retrieve  ·  reason  ·  cite  ·  ship</text><text x="450.0" y="82" class="mono" font-size="10.5" fill="#8c959f" font-weight="400" text-anchor="middle" letter-spacing="1.5">thanks for stopping by</text></svg>